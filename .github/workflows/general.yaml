name: general
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  prettier:
    name: prettier
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Run prettier checks
        run: npx --yes prettier@2.7.1 --check "**/*.{yaml,json,md}"

  super-linter:
    name: super-linter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Run super linter
        uses: github/super-linter/slim@985ef206aaca4d560cb9ee2af2b42ba44adc1d55 # v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: 'true'
          VALIDATE_BASH: 'true'
          VALIDATE_EDITORCONFIG: 'true'
          VALIDATE_MD: 'true'
          VALIDATE_YAML: 'true'
          FILTER_REGEX_EXCLUDE: '.*/(CHANGELOG\.md)'

  build-latex:
    name: build-latex
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Compile latex documents
        uses: xu-cheng/latex-action@8c9adec310ed05afa3650bd2727d1e71ca1dfd0d # v2
        with:
          working_directory: src
          root_file: resume.tex
          latexmk_use_lualatex: true
      - name: Upload resume.pdf
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume
          path: src/resume.pdf
          if-no-files-found: error

  release:
    name: release
    if: github.ref == 'refs/heads/main'
    needs:
      - prettier
      - super-linter
      - build-latex
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - name: Download resume.pdf from build-latex
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resume
      - name: Setup Node.js
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: Johnny Chang
          GIT_AUTHOR_EMAIL: johnnychang3662633@gmail.com
          GIT_COMMITTER_NAME: Johnny Chang
          GIT_COMMITTER_EMAIL: johnnychang3662633@gmail.com
        run: |
          npx \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p conventional-changelog-conventionalcommits \
            -p @semantic-release/changelog \
            -p @semantic-release/git \
            -p @semantic-release/github \
            -p semantic-release \
            semantic-release

  deploy-gh-pages:
    name: deploy-gh-pages
    if: github.ref == 'refs/heads/main'
    needs:
      - release
    runs-on: ubuntu-24.04
    steps:
      - name: Download resume.pdf from build-latex
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resume
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          force_orphan: true
          commit_message: 'release: update gh-pages to latest version'
